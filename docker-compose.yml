services:
  db:
    image: postgres:17
    profiles: [node]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  flyway-postgres:
    image: flyway/flyway:11
    profiles: [node]
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/migrations,filesystem:/flyway/seed
    volumes:
      - ./db/postgres/migrations:/flyway/migrations:ro
      - ./db/postgres/seed:/flyway/seed:ro
    command: migrate

  api-node:
    build:
      context: .
      dockerfile: backend-node/Dockerfile
    profiles: [node]
    init: true
    depends_on:
      db:
        condition: service_healthy
      flyway-postgres:
        condition: service_completed_successfully
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${API_PORT}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      retries: 3

  db-test:
    image: postgres:17
    profiles: [test]
    environment:
      POSTGRES_DB: booking_app_test
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_TEST_PORT}:5432"
    # Los datos viven en memoria: al bajar el contenedor desaparecen y la próxima vez empieza limpia
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      retries: 15

  flyway-postgres-test:
    image: flyway/flyway:11
    profiles: [test]
    depends_on:
      db-test:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://db-test:5432/booking_app_test
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      # Solo las migraciones: cada prueba crea sus propios datos
      FLYWAY_LOCATIONS: filesystem:/flyway/migrations
    volumes:
      - ./db/postgres/migrations:/flyway/migrations:ro
    command: migrate

volumes:
  postgres-data:
